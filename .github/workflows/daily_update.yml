name: Daily Dashboard Update

on:
  # Run at UTC 10:00 = Taiwan 18:00, weekdays only
  schedule:
    - cron: '0 10 * * 1-5'

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed history cache (only if missing)
        run: |
          if [ ! -f history_cache.json ]; then
            echo "No cache, seeding"
            python seed_history.py || true
          else
            echo "Cache exists, skip seed"
          fi

      - name: Test data sources
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python test_sources.py || true
        continue-on-error: true

      - name: Generate dashboard
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@example.com"
          git add index.html archive latest_data.json history_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update dashboard $(date '+%Y-%m-%d')"
          for i in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push failed on attempt $i, rebasing..."
            git pull --rebase origin main || true
          done
          echo "All push attempts failed"
          exit 1

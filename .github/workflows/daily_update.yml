name: Daily Dashboard Update

on:
  # æ¯å¤©å°ç£æé 19:00 (UTC 11:00) èªåå·è¡
  # èè³èå¸æ¸æç´ 18:00 å¾ç¼å¸ï¼19:00 è·ç¢ºä¿è³æé½å¨
  schedule:
    - cron: '0 11 * * 1-5'  # UTC 11:00 = å°ç£ 19:00ï¼é±ä¸å°é±äº

  # ä¹å¯ä»¥æåè§¸ç¼
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed history cache (é¦æ¬¡æå¿«åä¸è¶³æ)
        run: |
          NEED_SEED=0
          if [ ! -f history_cache.json ]; then
            echo "No cache file found"
            NEED_SEED=1
          else
            python3 -c "
          import json, sys
          try:
              c = json.load(open('history_cache.json'))
              v = len(c.get('vix', []))
              print(f'Cache has {v} VIX points')
              sys.exit(0 if v >= 7 else 1)
          except:
              sys.exit(1)
          " || NEED_SEED=1
          fi
          if [ "$NEED_SEED" = "1" ]; then
            echo "Running seed_history.py..."
            python seed_history.py || true
          else
            echo "Cache OK, skipping seed"
          fi
        continue-on-error: true

      - name: Test API sources (é©è­è³æä¾æº)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python test_sources.py || true
        continue-on-error: true

      - name: Generate dashboard
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@example.com"
          git add index.html archive/ latest_data.json history_cache.json
          git diff --cached --quiet || git commit -m "Update dashboard $(date '+%Y-%m-%d')"
          git push

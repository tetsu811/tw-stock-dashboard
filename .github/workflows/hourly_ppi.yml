name: Hourly Pentagon Pizza Index

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-ppi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Pentagon Pizza Index
        run: python3 fetch_ppi.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- ppi_latest.json; then
            echo "No PPI changes"
            exit 0
          fi
          git add ppi_latest.json
          git commit -m "chore(ppi): hourly refresh [skip ci]"
          for i in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push failed on attempt $i, rebasing..."
            git pull --rebase origin main || true
          done
          echo "All push attempts failed"
          exit 1
